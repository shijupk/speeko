[workspace]
members = [
    "crates/common",
    "crates/audio",
    "crates/dsp",
    "crates/vad",
    "crates/features",
    "crates/recognizer",
    "crates/store",
    "crates/app-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
